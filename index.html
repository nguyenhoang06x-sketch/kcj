<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vũ trụ ảnh</title>
    
<style>
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  overflow: hidden;
}

#container {
  width: 100vw;
  height: 100vh; /* hoặc: height: calc(var(--vh, 1vh) * 100); */
  background: radial-gradient(circle at center, #000010 0%, #000000 100%);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 11;
}

/* Cảnh báo landscape phong cách vũ trụ */
#landscape-warning {
  /* position: fixed;
  z-index: 9999;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, #1a237e 0%, #000 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.7s cubic-bezier(.4,2,.6,1); */
  display: none !important;
}
/* body.landscape-warning-active #landscape-warning,
body.portrait #landscape-warning {
  opacity: 1;
  pointer-events: auto;
} */

#landscape-warning .warning-content {
  position: relative;
  z-index: 2;
  padding: 2rem 2.5rem;
  border-radius: 24px;
  background: rgba(20, 30, 60, 0.7);
  box-shadow: 0 0 32px 8px #00eaff44, 0 0 0 2px #fff2 inset;
  border: 1.5px solid #00eaff88;
}
#landscape-warning h1 {
  font-family: 'Orbitron', 'Montserrat', Arial, sans-serif;
  font-size: 2.2rem;
  margin-bottom: 1rem;
  letter-spacing: 2px;
  color: #fff;
  
}
#landscape-warning p {
  font-size: 1.3rem;
  color: #e0eaff;
  text-shadow: 0 0 8px #00eaff99, 0 0 2px #fff;
}
#landscape-warning .stars-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(circle, #fff 1.2px, transparent 1.2px) 20px 30px/80px 80px repeat,
    radial-gradient(circle, #fff 1.5px, transparent 1.5px) 60px 80px/120px 120px repeat,
    radial-gradient(circle, #00eaff 1.2px, transparent 1.2px) 40px 60px/100px 100px repeat,
    radial-gradient(circle, #fff 0.8px, transparent 0.8px) 10px 10px/40px 40px repeat;
  opacity: 0.7;
  animation: stars-move 16s linear infinite;
}
#landscape-warning .stars-bg::before,
#landscape-warning .stars-bg::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0; left: 0;
  background-image:
    radial-gradient(circle, #fff 1.2px, transparent 1.2px),
    radial-gradient(circle, #00eaff 1.2px, transparent 1.2px),
    radial-gradient(circle, #fff 0.8px, transparent 0.8px);
  background-size: 80px 80px, 120px 120px, 40px 40px;
  background-position: 0 0, 40px 40px, 20px 20px;
  opacity: 0.7;
  animation: stars-move 16s linear infinite;
}
#landscape-warning .stars-bg::after {
  opacity: 0.5;
  background-size: 120px 120px, 60px 60px, 100px 100px;
  background-position: 60px 60px, 30px 30px, 10px 10px;
  animation-duration: 24s;
}
@keyframes stars-move {
  0% { background-position: 20px 30px, 60px 80px, 40px 60px, 10px 10px; }
  100% { background-position: 100px 100px, 0px 0px, 60px 60px, 40px 40px; }
}

#start-overlay {
  display: none !important;
  position: fixed;
  z-index: 10000;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 20, 40, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
}
#start-btn {
  font-size: 2rem;
  padding: 1rem 2.5rem;
  border-radius: 2rem;
  border: none;
  background: linear-gradient(90deg, #ffb6e6, #a259c7, #00eaff);
  color: #fff;
  box-shadow: 0 0 24px #fff6, 0 0 8px #00eaff;
  cursor: pointer;
  transition: background 0.3s;
}
#start-btn:hover {
  background: linear-gradient(90deg, #00eaff, #a259c7, #ffb6e6);
}

#dark-overlay {
  position: fixed;
  z-index: 5;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 10, 30, 0.92);
  pointer-events: none;
  transition: opacity 0.6s;
  opacity: 1;
}
body.intro-started #dark-overlay {
  opacity: 0;
  transition: opacity 1.2s;
}

body:not(.intro-started):not(.portrait) #info,
body:not(.intro-started):not(.portrait) #landscape-warning,
body:not(.intro-started):not(.portrait) .main-content,
body:not(.intro-started):not(.portrait) .text-ring,
body:not(.intro-started):not(.portrait) .galaxy-points,
body:not(.intro-started):not(.portrait) .starfield {
  opacity: 0 !important;
  pointer-events: none !important;
}

body:not(.intro-started):not(.portrait) #dark-overlay {
  display: block;
  opacity: 1;
}
body.portrait #dark-overlay {
  display: none !important;
  opacity: 0 !important;
}
body.landscape-warning-active #container canvas,
body.portrait #container canvas {
  filter: blur(12px) brightness(0.5) grayscale(0.3);
  opacity: 0.3;
  transition: filter 0.7s, opacity 0.7s cubic-bezier(.4,2,.6,1);
}
body:not(.landscape-warning-active):not(.portrait) #container canvas {
  filter: blur(0) brightness(1) grayscale(0);
  opacity: 1;
  transition: filter 1.2s, opacity 1.2s cubic-bezier(.4,2,.6,1);
}

body.landscape-warning-active #landscape-warning {
  opacity: 1;
  pointer-events: auto;
}

body:not(.landscape-warning-active) #container canvas {
  filter: blur(0) brightness(1) grayscale(0);
  opacity: 1;
  transition: filter 1.2s, opacity 1.2s cubic-bezier(.4,2,.6,1);
}

.rotate-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 18px auto;
  background: url('data:image/svg+xml;utf8,<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="16" width="32" height="24" rx="6" fill="%23fff" stroke="%2300eaff" stroke-width="2"/><path d="M28 8v4" stroke="%2300eaff" stroke-width="2" stroke-linecap="round"/><path d="M28 44v4" stroke="%2300eaff" stroke-width="2" stroke-linecap="round"/><path d="M8 28h4" stroke="%2300eaff" stroke-width="2" stroke-linecap="round"/><path d="M44 28h4" stroke="%2300eaff" stroke-width="2" stroke-linecap="round"/><path d="M18 38l-4 4" stroke="%23a259f7" stroke-width="2" stroke-linecap="round"/><path d="M38 38l4 4" stroke="%23a259f7" stroke-width="2" stroke-linecap="round"/><path d="M18 18l-4-4" stroke="%23a259f7" stroke-width="2" stroke-linecap="round"/><path d="M38 18l4-4" stroke="%23a259f7" stroke-width="2" stroke-linecap="round"/></svg>') center/contain no-repeat;
  animation: rotate-phone 1.6s infinite cubic-bezier(.4,2,.6,1);
}
@keyframes rotate-phone {
  0% { transform: rotate(-18deg); }
  20% { transform: rotate(18deg); }
  40% { transform: rotate(-18deg); }
  100% { transform: rotate(-18deg); }
}

<body>
  <div id="container"></div>
    <div id="landscape-warning">
      <div class="warning-content">
        <div class="rotate-icon"></div>
        <h1>NHỚ EM</h1>
        <h1>Tinh Cầu</h1>
        <div class="stars-bg"></div>
      </div>
    </div>
    <div id="dark-overlay"></div>
    <div id="info">
      
    </div>
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    
<script>
// ---- KHỞI TẠO SCENE, CAMERA, RENDERER ----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
camera.position.set(0, 20, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('container').appendChild(renderer.domElement);

// ---- KHỞI TẠO CONTROLS ----
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.enabled = false;
controls.target.set(0, 0, 0);
controls.enablePan = false;
// Cho phép camera tới rất gần: chế độ tự động focus ảnh đứng cách tấm ảnh
// khoảng 4 đơn vị, nếu để minDistance = 15 thì OrbitControls.update() sẽ kẹp
// camera ra xa lại mỗi frame và không bao giờ zoom gần được.
controls.minDistance = 2;
controls.maxDistance = 300;
controls.zoomSpeed = 0.3;
controls.rotateSpeed = 0.3;
controls.update();

// ---- AUDIO SOURCES (sẽ được thay thế khi build) ----
const audioSources = [];

// ---- HÀM TIỆN ÍCH TẠO HIỆU ỨNG GLOW ----
function createGlowMaterial(color, size = 128, opacity = 0.55) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const context = canvas.getContext('2d');
  const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, color);
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  context.fillStyle = gradient;
  context.fillRect(0, 0, size, size);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity: opacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  return new THREE.Sprite(material);
}

// ---- TẠO CÁC THÀNH PHẦN CỦA SCENE ----

// Glow trung tâm
const centralGlow = createGlowMaterial('rgba(255,255,255,0.8)', 156, 0.25);
centralGlow.scale.set(8, 8, 1);
scene.add(centralGlow);

// Các đám mây tinh vân (Nebula) ngẫu nhiên
for (let i = 0; i < 15; i++) {
  const hue = Math.random() * 360;
  const color = `hsla(${hue}, 80%, 50%, 0.6)`;
  const nebula = createGlowMaterial(color, 256);
  nebula.scale.set(100, 100, 1);
  nebula.position.set(
    (Math.random() - 0.5) * 175,
    (Math.random() - 0.5) * 175,
    (Math.random() - 0.5) * 175
  );
  scene.add(nebula);
}

// ---- TẠO THIÊN HÀ (GALAXY) ----
const galaxyParameters = {
  count: 100000,
  arms: 6,
  radius: 100,
  spin: 0.5,
  randomness: 0.2,
  randomnessPower: 20,
  insideColor: new THREE.Color(0xd63ed6),

// Mật độ điểm khi chỉ có 1 ảnh (cao nhất)
const maxDensity = 50000;
// Mật độ điểm khi có 10 ảnh trở lên (thấp nhất)
const minDensity = 2000;
// Số lượng ảnh tối đa mà chúng ta quan tâm để điều chỉnh
const maxGroupsForScale = 14;

let pointsPerGroup;

if (numGroups <= 1) {
  pointsPerGroup = maxDensity;
} else if (numGroups >= maxGroupsForScale) {
  pointsPerGroup = minDensity;
} else {
  const t = (numGroups - 1) / (maxGroupsForScale - 1);
  pointsPerGroup = Math.floor(maxDensity * (1 - t) + minDensity * t);
}

if (pointsPerGroup * numGroups > galaxyParameters.count) {
  pointsPerGroup = Math.floor(galaxyParameters.count / numGroups);
}

const positions = new Float32Array(galaxyParameters.count * 3);
const colors = new Float32Array(galaxyParameters.count * 3);


let pointIdx = 0;
for (let i = 0; i < galaxyParameters.count; i++) {
  const radius = Math.pow(Math.random(), galaxyParameters.randomnessPower) * galaxyParameters.radius;
  const branchAngle = (i % galaxyParameters.arms) / galaxyParameters.arms * Math.PI * 2;
  const spinAngle = radius * galaxyParameters.spin;

  const randomX = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
  const randomY = (Math.random() - 0.5) * galaxyParameters.randomness * radius * 1.2; // thay từ 0.5 lên 1.5
  const randomZ = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
  const totalAngle = branchAngle + spinAngle;

  if (radius < 30 && Math.random() < 0.8) continue;

  const i3 = pointIdx * 3;
  positions[i3] = Math.cos(totalAngle) * radius + randomX;
  positions[i3 + 1] = randomY;
  positions[i3 + 2] = Math.sin(totalAngle) * radius + randomZ;

  const mixedColor = new THREE.Color(0xff66ff);
  mixedColor.lerp(new THREE.Color(0x66ffff), radius / galaxyParameters.radius);
  mixedColor.multiplyScalar(0.7 + 0.3 * Math.random());
  colors[i3] = mixedColor.r;
  colors[i3 + 1] = mixedColor.g;
  colors[i3 + 2] = mixedColor.b;

  pointIdx++;
}

const galaxyGeometry = new THREE.BufferGeometry();
galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, pointIdx * 3), 3));
galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors.slice(0, pointIdx * 3), 3));

const galaxyMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0.0 },
    uSize: { value: 50.0 * renderer.getPixelRatio() },
    uRippleTime: { value: -1.0 },
    uRippleSpeed: { value: 40.0 },
    uRippleWidth: { value: 20.0 }
  },
  vertexShader: `
        uniform float uSize;
        uniform float uTime;
        uniform float uRippleTime;
        uniform float uRippleSpeed;
        uniform float uRippleWidth;

        varying vec3 vColor;

        void main() {
            // Lấy màu gốc từ geometry (giống hệt vertexColors: true)
            vColor = color;

            vec4 modelPosition = modelMatrix * vec4(position, 1.0);

            // ---- LOGIC HIỆU ỨNG GỢN SÓNG ----
            if (uRippleTime > 0.0) {
                float rippleRadius = (uTime - uRippleTime) * uRippleSpeed;
                float particleDist = length(modelPosition.xyz);

                float strength = 1.0 - smoothstep(rippleRadius - uRippleWidth, rippleRadius + uRippleWidth, particleDist);
                strength *= smoothstep(rippleRadius + uRippleWidth, rippleRadius - uRippleWidth, particleDist);

                if (strength > 0.0) {
                    vColor += vec3(strength * 2.0); // Làm màu sáng hơn khi sóng đi qua
                }
            }

            vec4 viewPosition = viewMatrix * modelPosition;
            gl_Position = projectionMatrix * viewPosition;
            // Dòng này làm cho các hạt nhỏ hơn khi ở xa, mô phỏng hành vi của PointsMaterial
            gl_PointSize = uSize / -viewPosition.z;
        }
    `,
  fragmentShader: `
        varying vec3 vColor;
        void main() {
            // Làm cho các hạt có hình tròn thay vì hình vuông
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;

            gl_FragColor = vec4(vColor, 1.0);
        }
    `,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  vertexColors: true
});
const galaxy = new THREE.Points(galaxyGeometry, galaxyMaterial);
scene.add(galaxy);

function createNeonTexture(image, size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const aspectRatio = image.width / image.height;
  let drawWidth, drawHeight, offsetX, offsetY;
  if (aspectRatio > 1) {
    drawWidth = size;
    drawHeight = size / aspectRatio;
    offsetX = 0;
    offsetY = (size - drawHeight) / 2;
  } else {
    drawHeight = size;
    drawWidth = size * aspectRatio;
    offsetX = (size - drawWidth) / 2;
    offsetY = 0;
  }
  ctx.clearRect(0, 0, size, size);
  const cornerRadius = size * 0.1;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(offsetX + cornerRadius, offsetY);
  ctx.lineTo(offsetX + drawWidth - cornerRadius, offsetY);
  ctx.arcTo(offsetX + drawWidth, offsetY, offsetX + drawWidth, offsetY + cornerRadius, cornerRadius);
  ctx.lineTo(offsetX + drawWidth, offsetY + drawHeight - cornerRadius);
  ctx.arcTo(offsetX + drawWidth, offsetY + drawHeight, offsetX + drawWidth - cornerRadius, offsetY + drawHeight, cornerRadius);
  ctx.lineTo(offsetX + cornerRadius, offsetY + drawHeight);
  ctx.arcTo(offsetX, offsetY + drawHeight, offsetX, offsetY + drawHeight - cornerRadius, cornerRadius);
  ctx.lineTo(offsetX, offsetY + cornerRadius);
  ctx.arcTo(offsetX, offsetY, offsetX + cornerRadius, offsetY, cornerRadius);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(image, offsetX, offsetY, drawWidth, drawHeight);
  ctx.restore();
  return new THREE.CanvasTexture(canvas);
}

// Danh sách các nhóm ảnh đã tải xong (để camera tự động focus)
const photoGroups = [];

for (let group = 0; group < numGroups; group++) {
  const groupPositions = new Float32Array(pointsPerGroup * 3);
  const groupColorsNear = new Float32Array(pointsPerGroup * 3);
  const groupColorsFar = new Float32Array(pointsPerGroup * 3);
  let validPointCount = 0;

  for (let i = 0; i < pointsPerGroup; i++) {
    const idx = validPointCount * 3;
    const globalIdx = group * pointsPerGroup + i;
    const radius = Math.pow(Math.random(), galaxyParameters.randomnessPower) * galaxyParameters.radius;
    if (radius < 30) continue;

    const branchAngle = (globalIdx % galaxyParameters.arms) / galaxyParameters.arms * Math.PI * 2;
    const spinAngle = radius * galaxyParameters.spin;

    const randomX = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
    const randomY = (Math.random() - 0.5) * galaxyParameters.randomness * radius * 0.5;
    const randomZ = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
    const totalAngle = branchAngle + spinAngle;

    groupPositions[idx] = Math.cos(totalAngle) * radius + randomX;
    groupPositions[idx + 1] = randomY;
    groupPositions[idx + 2] = Math.sin(totalAngle) * radius + randomZ;

    const colorNear = new THREE.Color(0xffffff);
    groupColorsNear[idx] = colorNear.r;
    groupColorsNear[idx + 1] = colorNear.g;
    groupColorsNear[idx + 2] = colorNear.b;

    const colorFar = galaxyParameters.insideColor.clone();
    colorFar.lerp(galaxyParameters.outsideColor, radius / galaxyParameters.radius);
    colorFar.multiplyScalar(0.7 + 0.3 * Math.random());
    groupColorsFar[idx] = colorFar.r;
    groupColorsFar[idx + 1] = colorFar.g;
    groupColorsFar[idx + 2] = colorFar.b;

    validPointCount++;
  }

  if (validPointCount === 0) continue;

  // Geometry cho trạng thái gần camera
  const groupGeometryNear = new THREE.BufferGeometry();
  groupGeometryNear.setAttribute('position', new THREE.BufferAttribute(groupPositions.slice(0, validPointCount * 3), 3));
  groupGeometryNear.setAttribute('color', new THREE.BufferAttribute(groupColorsNear.slice(0, validPointCount * 3), 3));

  // Geometry cho trạng thái xa camera
  const groupGeometryFar = new THREE.BufferGeometry();
  groupGeometryFar.setAttribute('position', new THREE.BufferAttribute(groupPositions.slice(0, validPointCount * 3), 3));
  groupGeometryFar.setAttribute('color', new THREE.BufferAttribute(groupColorsFar.slice(0, validPointCount * 3), 3));

  // Tính toán tâm của nhóm điểm và dịch chuyển về gốc tọa độ
  const posAttr = groupGeometryFar.getAttribute('position');
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < posAttr.count; i++) {
    cx += posAttr.getX(i);
    cy += posAttr.getY(i);
    cz += posAttr.getZ(i);
  }
  cx /= posAttr.count;
  cy /= posAttr.count;
  cz /= posAttr.count;
  groupGeometryNear.translate(-cx, -cy, -cz);
  groupGeometryFar.translate(-cx, -cy, -cz);

  // Tải hình ảnh và tạo vật thể
  const img = new window.Image();
  img.crossOrigin = "Anonymous";
  img.onload = () => {
    createPointsObject(img);
  };
  img.onerror = () => {
    console.warn(`[VuTruTinhYeu] Không tải được ảnh index ${group}:`, heartImages[group]);
    // Tạo texture fallback (hình tròn đơn giản) để nhóm vẫn render được
    const fallbackCanvas = document.createElement('canvas');
    fallbackCanvas.width = fallbackCanvas.height = 256;
    const fctx = fallbackCanvas.getContext('2d');
    const gradient = fctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
    gradient.addColorStop(0.5, 'rgba(255,100,100,0.5)');
    gradient.addColorStop(1, 'rgba(255,0,0,0)');
    fctx.fillStyle = gradient;
    fctx.fillRect(0, 0, 256, 256);
    const fallbackTexture = new THREE.CanvasTexture(fallbackCanvas);
    createPointsObject({ width: 256, height: 256 }, fallbackTexture);
  };
  img.src = heartImages[group];

  function createPointsObject(imageOrCanvas, precreatedTexture) {
    const neonTexture = precreatedTexture || createNeonTexture(imageOrCanvas, 256);

    // Material khi ở gần
    const materialNear = new THREE.PointsMaterial({
      size: 1.8,
      map: neonTexture,
      transparent: false,
      alphaTest: 0.2,
      depthWrite: true,
      depthTest: true,
      blending: THREE.NormalBlending,
      vertexColors: true
    });

    // Material khi ở xa
    const materialFar = new THREE.PointsMaterial({
      size: 1.8,
      map: neonTexture,
      transparent: true,
      alphaTest: 0.2,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true
    });

    const pointsObject = new THREE.Points(groupGeometryFar, materialFar);
    pointsObject.position.set(cx, cy, cz); // Đặt lại vị trí ban đầu trong scene

    // Lưu trữ các trạng thái để chuyển đổi sau này
    pointsObject.userData.materialNear = materialNear;
    pointsObject.userData.geometryNear = groupGeometryNear;
    pointsObject.userData.materialFar = materialFar;
    pointsObject.userData.geometryFar = groupGeometryFar;

    photoGroups.push(pointsObject);

    scene.add(pointsObject);
  };
}

function createShootingStar() {
  const trailLength = 100;

  // Đầu sao băng
  const headGeometry = new THREE.SphereGeometry(2, 32, 32);
  const headMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff,

    opacity: 0,
    blending: THREE.AdditiveBlending
  });
  const head = new THREE.Mesh(headGeometry, headMaterial);

  // Hào quang của sao băng
  const glowGeometry = new THREE.SphereGeometry(3, 32, 32);
  const glowMaterial = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: `
            varying vec3 vNormal;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
    fragmentShader: `
            varying vec3 vNormal;
            uniform float time;
            void main() {
                float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                gl_FragColor = vec4(1.0, 1.0, 1.0, intensity * (0.8 + sin(time * 5.0) * 0.2));
            }
        `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide
  });
  const glow = new THREE.Mesh(glowGeometry, glowMaterial);
  head.add(glow);

  const atmosphereGeometry = new THREE.SphereGeometry(planetRadius * 1.05, 48, 48);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    uniforms: {
      glowColor: { value: new THREE.Color(0xe0b3ff) }
    },
    vertexShader: `
        varying vec3 vNormal;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        varying vec3 vNormal;
        uniform vec3 glowColor;
        void main() {
            float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
            gl_FragColor = vec4(glowColor, 1.0) * intensity;
        }
    `,
    side: THREE.BackSide, // Nhìn từ bên trong
    blending: THREE.AdditiveBlending,
    transparent: true
  });

  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  planet.add(atmosphere); // Thêm khí quyển làm con của hành tinh

  // Đuôi sao băng
  const curve = createRandomCurve();
  const trailPoints = [];
  for (let i = 0; i < trailLength; i++) {
    const progress = i / (trailLength - 1);
    trailPoints.push(curve.getPoint(progress));
  }
  const trailGeometry = new THREE.BufferGeometry().setFromPoints(trailPoints);
  const trailMaterial = new THREE.LineBasicMaterial({
    color: 0x99eaff,
    transparent: true,
    opacity: 0.7,
    linewidth: 2
  });
  const trail = new THREE.Line(trailGeometry, trailMaterial);

  const shootingStarGroup = new THREE.Group();
  shootingStarGroup.add(head);
  shootingStarGroup.add(trail);
  shootingStarGroup.userData = {
    curve: curve,
    progress: 0,
    speed: 0.001 + Math.random() * 0.001,
    life: 0,
    maxLife: 300,
    head: head,
    trail: trail,
    trailLength: trailLength,
    trailPoints: trailPoints,
  };
  scene.add(shootingStarGroup);
  shootingStars.push(shootingStarGroup);
}

function createRandomCurve() {
  const points = [];
  const startPoint = new THREE.Vector3(-200 + Math.random() * 100, -100 + Math.random() * 200, -100 + Math.random() * 200);
  const endPoint = new THREE.Vector3(600 + Math.random() * 200, startPoint.y + (-100 + Math.random() * 200), startPoint.z + (-100 + Math.random() * 200));
  const controlPoint1 = new THREE.Vector3(startPoint.x + 200 + Math.random() * 100, startPoint.y + (-50 + Math.random() * 100), startPoint.z + (-50 + Math.random() * 100));
  const controlPoint2 = new THREE.Vector3(endPoint.x - 200 + Math.random() * 100, endPoint.y + (-50 + Math.random() * 100), endPoint.z + (-50 + Math.random() * 100));

  points.push(startPoint, controlPoint1, controlPoint2, endPoint);
  return new THREE.CubicBezierCurve3(startPoint, controlPoint1, controlPoint2, endPoint);
}

function createPlanetTexture(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Nền gradient
  const gradient = ctx.createRadialGradient(size / 2, size / 2, size / 8, size / 2, size / 2, size / 2);
  gradient.addColorStop(0.00, '#f8bbd0');
  gradient.addColorStop(0.12, '#f48fb1');
  gradient.addColorStop(0.22, '#f06292');
  gradient.addColorStop(0.35, '#ffffff');
  gradient.addColorStop(0.50, '#e1aaff');
  gradient.addColorStop(0.62, '#a259f7');
  gradient.addColorStop(0.75, '#b2ff59');
  gradient.addColorStop(1.00, '#3fd8c7');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  // Các đốm màu ngẫu nhiên
  const spotColors = ['#f8bbd0', '#f8bbd0', '#f48fb1', '#f48fb1', '#f06292', '#f06292', '#ffffff', '#e1aaff', '#a259f7', '#b2ff59'];
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const radius = 30 + Math.random() * 120;
    const color = spotColors[Math.floor(Math.random() * spotColors.length)];
    const spotGradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
    spotGradient.addColorStop(0, color + 'cc'); // 'cc' là alpha
    spotGradient.addColorStop(1, color + '00');
    ctx.fillStyle = spotGradient;
    ctx.fillRect(0, 0, size, size);
  }

  // Các đường cong (swirls)
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(Math.random() * size, Math.random() * size);
    ctx.bezierCurveTo(Math.random() * size, Math.random() * size, Math.random() * size, Math.random() * size, Math.random() * size, Math.random() * size);
    ctx.strokeStyle = 'rgba(180, 120, 200, ' + (0.12 + Math.random() * 0.18) + ')';
    ctx.lineWidth = 8 + Math.random() * 18;
    ctx.stroke();
  }

  // Áp dụng blur
  if (ctx.filter !== undefined) {
    ctx.filter = 'blur(2px)';
    ctx.drawImage(canvas, 0, 0);
    ctx.filter = 'none';
  }

  return new THREE.CanvasTexture(canvas);
}

// Shader cho hiệu ứng bão trên bề mặt hành tinh
const stormShader = {
  uniforms: {
    time: { value: 0.0 },
    baseTexture: { value: null }
  },
  vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
  fragmentShader: `
        uniform float time;
        uniform sampler2D baseTexture;
        varying vec2 vUv;
        void main() {
            vec2 uv = vUv;
            float angle = length(uv - vec2(0.5)) * 3.0;
            float twist = sin(angle * 3.0 + time) * 0.1;
            uv.x += twist * sin(time * 0.5);
            uv.y += twist * cos(time * 0.5);
            vec4 texColor = texture2D(baseTexture, uv);
            float noise = sin(uv.x * 10.0 + time) * sin(uv.y * 10.0 + time) * 0.1;
            texColor.rgb += noise * vec3(0.8, 0.4, 0.2);
            gl_FragColor = texColor;
        }
    `
};

    // ---- Logic phân tích và điều chỉnh kích thước font chữ (được giữ nguyên) ----
    function getCharType(char) {
      const charCode = char.charCodeAt(0);
      if ((charCode >= 0x4E00 && charCode <= 0x9FFF) || // CJK
        (charCode >= 0x3040 && charCode <= 0x309F) || // Hiragana
        (charCode >= 0x30A0 && charCode <= 0x30FF) || // Katakana
        (charCode >= 0xAC00 && charCode <= 0xD7AF)) { // Korean
        return 'cjk';
      } else if (charCode >= 0 && charCode <= 0x7F) { // Latin
        return 'latin';
      }
      return 'other';
    }

    let charCounts = { cjk: 0, latin: 0, other: 0 };
    for (let char of text) {
      charCounts[getCharType(char)]++;
    }

    const totalChars = text.length;
    const cjkRatio = charCounts.cjk / totalChars;

    let scaleParams = { fontScale: 0.75, spacingScale: 1.1 };

    if (i === 0) {
      scaleParams.fontScale = 0.55;
      scaleParams.spacingScale = 0.9;
    } else if (i === 1) {
      scaleParams.fontScale = 0.65;
      scaleParams.spacingScale = 1.0;
    }

    if (cjkRatio > 0) {
      scaleParams.fontScale *= 0.9;
      scaleParams.spacingScale *= 1.1;
    }
    // ---- Kết thúc logic phân tích font ----

    // ---- Tạo texture chữ động ----
    const textureHeight = 150;
    // Giới hạn cứng chiều rộng canvas texture (resolution) — không clamp geometry.
    // Mobile GPU thường chỉ hỗ trợ 4096-8192px. Giới hạn 4096px an toàn cho mọi thiết bị.
    const MAX_TEXTURE_WIDTH = 4096;
    // Font size khởi tạo (tương đối so với textureHeight)
    let fontSize = Math.max(130, 0.8 * textureHeight);
    // Font size tối thiểu cho phép đọc được (đừng để font quá nhỏ)
    const MIN_FONT_SIZE = 24;

    // ---- BỐ CỤC VÒNG CHỮ: mỗi tile = ĐÚNG 1 lần chữ + khoảng trống rõ ràng ----
    // Trước đây vẽ repeatCount lần chữ vào canvas rồi set repeat.x = repeatCount
    // → chữ bị nhân đôi (repeatCount²) quanh vòng, dày đặc chồng lên nhau.
    // Giờ chỉ vẽ 1 lần chữ mỗi tile, phần còn lại bỏ trống làm khoảng cách;
    // repeat.x = số lần lặp mong muốn → quanh vòng hiển thị: chữ - gap - chữ - gap…
    const GAP_FRACTION = 0.9; // khoảng trống giữa 2 lần lặp ≥ 90% bề rộng chữ
    // MAX_REPEATS = 2: mỗi ring chỉ có 2 cung chữ đối diện → cung chữ dài,
    // chữ rõ ràng bám theo chu vi vòng (tránh hiện tượng chữ bị đổ chéo thành
    // dải thẳng khi cung quá ngắn). Với side: FrontSide, 2 cung đối diện luôn
    // có ≥ 1 cung hướng về camera.
    const MAX_REPEATS = 2;    // không nhồi nhét quá 2 lần lặp quanh vòng

    // Đo chiều rộng thật của text (1 lần) ở font hiện tại
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');

    const singleText = ringTexts[i % ringTexts.length];

    function measureTextWidth(px) {
      tempCtx.font = 'bold ' + px + 'px Arial, sans-serif';
      return tempCtx.measureText(singleText).width;
    }

    let textWidth = measureTextWidth(fontSize);

    // Nếu 1 lần chữ + khoảng trống vượt giới hạn texture → GIẢM font
    // (chỉ khi bắt buộc, có sàn MIN_FONT_SIZE để vẫn đọc được)
    if (textWidth * (1 + GAP_FRACTION) > MAX_TEXTURE_WIDTH) {
      fontSize = Math.max(MIN_FONT_SIZE, Math.floor(fontSize * MAX_TEXTURE_WIDTH / (textWidth * (1 + GAP_FRACTION))));
      textWidth = measureTextWidth(fontSize);
    }

    // Chu vi THỰC TẾ của geometry ring (không clamp) — dùng cho repeat.x của texture
    const geometryCircumference = 2 * Math.PI * ringRadius;
    // Số lần lặp mong muốn để mỗi lần chữ có khoảng trống ≥ GAP_FRACTION × bề rộng chữ
    const textWorldWidth = textWidth / textureHeight; // bề rộng chữ theo đơn vị world
    let repeatCount = Math.floor(geometryCircumference / (textWorldWidth * (1 + GAP_FRACTION)));
    repeatCount = Math.min(Math.max(1, repeatCount), MAX_REPEATS);

    // Bề rộng canvas: đủ chứa (chữ + khoảng trống), đồng thời giữ độ phân giải
    // ngang ≈ textureHeight để chữ không bị giãn méo theo chu vi; giới hạn 4096
    let canvasTextureWidth = Math.ceil(Math.max(
      textWidth * (1 + GAP_FRACTION),
      geometryCircumference * textureHeight / repeatCount
    ));
    canvasTextureWidth = Math.min(MAX_TEXTURE_WIDTH, Math.max(1, canvasTextureWidth));

    // Tỷ lệ thu nhỏ độ dày viền/glow theo font size (giữ nhìn đồng nhất khi font bị giảm)
    const strokeScale = fontSize / 130;

    // Vẽ text lên canvas chính — CHỈ 1 lần, phần còn lại để trống làm khoảng cách
    const textCanvas = document.createElement('canvas');
    textCanvas.width = Math.ceil(Math.max(1, canvasTextureWidth));
    textCanvas.height = textureHeight;
    const ctx = textCanvas.getContext('2d');

    ctx.clearRect(0, 0, textCanvas.width, textureHeight);
    ctx.font = `bold ${fontSize}px Arial, sans-serif`;
    ctx.fillStyle = 'white';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // Viền đen dày quanh từng ký tự để chữ nổi bật trên nền hành tinh sáng
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 10 * strokeScale;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.strokeText(singleText, 0, textureHeight * 0.82);

    // Viền trắng mảnh phía trong để chữ sắc nét (bỏ glow shadowBlur)
    ctx.lineWidth = 4 * strokeScale;
    ctx.strokeStyle = '#fff';
    ctx.strokeText(singleText, 0, textureHeight * 0.82); // căn dòng thấp hơn

    // Phần fill trắng
    ctx.fillStyle = '#fff';
    ctx.fillText(singleText, 0, textureHeight * 0.84);

    const ringTexture = new THREE.CanvasTexture(textCanvas);
    ringTexture.wrapS = THREE.RepeatWrapping;
    // repeat.x = số lần lặp MONG MUỐN quanh vòng (mỗi tile = 1 chữ + khoảng trống)
    ringTexture.repeat.x = repeatCount;
    ringTexture.needsUpdate = true;

    const ringGeometry = new THREE.CylinderGeometry(ringRadius, ringRadius, 1, 128, 1, true);

    const ringMaterial = new THREE.MeshBasicMaterial({
      map: ringTexture,
      transparent: true,
      // Chỉ hiển thị mặt ngoài hướng về camera — mặt sau (bị lật ngược theo góc nhìn 3D)
      // sẽ tự động ẩn đi, không còn 2 lớp chữ chồng nhau từ 2 hướng.
      side: THREE.FrontSide,
      alphaTest: 0.01,
      opacity: 1,
      depthWrite: false,
    });

    const textRingMesh = new THREE.Mesh(ringGeometry, ringMaterial);
    textRingMesh.position.set(0, 0, 0);
    textRingMesh.rotation.y = Math.PI / 2;

    const ringGroup = new THREE.Group();
    ringGroup.add(textRingMesh);
    ringGroup.userData = {
      ringRadius: ringRadius,
      angleOffset: 0.15 * Math.PI * 0.5,
      speed: 0.002 + 0.00025, // Tốc độ quay
      tiltSpeed: 0, rollSpeed: 0, pitchSpeed: 0, // Tốc độ lắc
      tiltAmplitude: Math.PI / 3, rollAmplitude: Math.PI / 6, pitchAmplitude: Math.PI / 8, // Biên độ lắc
      tiltPhase: Math.PI * 2, rollPhase: Math.PI * 2, pitchPhase: Math.PI * 2, // Pha lắc
      isTextRing: true
    };

    const initialRotationX = i / numRings * (Math.PI / 1);
    ringGroup.rotation.x = initialRotationX;
    scene.add(ringGroup);
    window.textRings.push(ringGroup);
  }
}

createTextRings();

function updateTextRingsRotation() {
  if (!window.textRings || !camera) return;

  window.textRings.forEach((ringGroup, index) => {
    ringGroup.children.forEach(child => {
      if (child.userData.initialAngle !== undefined) {
        const angle = child.userData.initialAngle + ringGroup.userData.angleOffset;
        const x = Math.cos(angle) * child.userData.ringRadius;
        const z = Math.sin(angle) * child.userData.ringRadius;
        child.position.set(x, 0, z);

        const worldPos = new THREE.Vector3();
        child.getWorldPosition(worldPos);

        const lookAtVector = new THREE.Vector3().subVectors(camera.position, worldPos).normalize();
        const rotationY = Math.atan2(lookAtVector.x, lookAtVector.z);
        child.rotation.y = rotationY;
      }
    });
  });
}

function animatePlanetSystem() {
  if (window.textRings) {
    const time = Date.now() * 0.001;
    window.textRings.forEach((ringGroup, index) => {
      const userData = ringGroup.userData;
      userData.angleOffset += userData.speed;

      // Chuyển động lắc lư
      const tilt = Math.sin(time * userData.tiltSpeed + userData.tiltPhase) * userData.tiltAmplitude;
      const roll = Math.cos(time * userData.rollSpeed + userData.rollPhase) * userData.rollAmplitude;
      const pitch = Math.sin(time * userData.pitchSpeed + userData.pitchPhase) * userData.pitchAmplitude;

      ringGroup.rotation.x = (index / window.textRings.length) * (Math.PI / 1) + tilt;
      ringGroup.rotation.z = roll;
      ringGroup.rotation.y = userData.angleOffset + pitch;

      const verticalBob = Math.sin(time * (userData.tiltSpeed * 0.7) + userData.tiltPhase) * 0.3;
      ringGroup.position.y = verticalBob;

      const pulse = (Math.sin(time * 1.5 + index) + 1) / 2; // giá trị từ 0 đến 1
      const textMesh = ringGroup.children[0];
      if (textMesh && textMesh.material) {
        // Thay đổi độ mờ từ 0.7 đến 1.0
        textMesh.material.opacity = 0.7 + pulse * 0.3;
      }
    });
    updateTextRingsRotation();
  }
}

// ---- VÒNG LẶP ANIMATE ----
let fadeOpacity = 0.1;
let fadeInProgress = false;

// =======================================================================
// ---- THÊM HIỆU ỨNG GỢI Ý NHẤN VÀO TINH CẦU (HINT ICON) ----
// =======================================================================

let hintIcon;
let hintText;
let bigTitleText;
/**
 * Tạo icon con trỏ chuột 3D để gợi ý người dùng.
 * PHIÊN BẢN HOÀN CHỈNH: Con trỏ màu trắng đồng nhất và được đặt ở vị trí
 * xa hơn so với quả cầu trung tâm.
 */
function createHintIcon() {
  hintIcon = new THREE.Group();
  hintIcon.name = 'hint-icon-group';
  scene.add(hintIcon);

  const cursorVisuals = new THREE.Group();

  // --- 1. TẠO HÌNH DẠNG CON TRỎ (Giữ nguyên) ---
  const cursorShape = new THREE.Shape();
  const h = 1.5;
  const w = h * 0.5;

  cursorShape.moveTo(0, 0);
  cursorShape.lineTo(-w * 0.4, -h * 0.7);
  cursorShape.lineTo(-w * 0.25, -h * 0.7);
  cursorShape.lineTo(-w * 0.5, -h);
  cursorShape.lineTo(w * 0.5, -h);
  cursorShape.lineTo(w * 0.25, -h * 0.7);
  cursorShape.lineTo(w * 0.4, -h * 0.7);
  cursorShape.closePath();

  // --- 2. TẠO CON TRỎ MÀU TRẮNG ---

  // Lớp nền (trước là viền đen, giờ là nền trắng)
  const backgroundGeometry = new THREE.ShapeGeometry(cursorShape);
  const backgroundMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff, // THAY ĐỔI: Chuyển viền thành màu trắng
    side: THREE.DoubleSide
  });
  const backgroundMesh = new THREE.Mesh(backgroundGeometry, backgroundMaterial);

  // Lớp trắng bên trong (giờ không cần thiết nhưng giữ lại để đảm bảo độ dày)
  const foregroundGeometry = new THREE.ShapeGeometry(cursorShape);
  const foregroundMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff, // Giữ màu trắng
    side: THREE.DoubleSide
  });
  const foregroundMesh = new THREE.Mesh(foregroundGeometry, foregroundMaterial);

  foregroundMesh.scale.set(0.8, 0.8, 1);
  foregroundMesh.position.z = 0.01;

  cursorVisuals.add(backgroundMesh, foregroundMesh);
  cursorVisuals.position.y = h / 2;
  cursorVisuals.rotation.x = Math.PI / 2;

  // --- 3. HOÀN THIỆN ICON ---
  // (Đã bỏ vòng tròn trắng trơn bao quanh con trỏ: vòng này nằm phía trên hành
  // tinh trông như 1 ring chữ không có chữ, gây rối — chỉ giữ lại con trỏ để
  // gợi ý "chạm vào tinh cầu".)
  hintIcon.add(cursorVisuals);

  // THAY ĐỔI: Đặt icon ở vị trí xa hơn
  hintIcon.position.set(1.5, 1.5, 15); // Tăng giá trị Z từ 12 lên 20

  hintIcon.scale.set(0.8, 0.8, 0.8);
  hintIcon.lookAt(planet.position);
  hintIcon.userData.initialPosition = hintIcon.position.clone();
}

/**
 * Animate icon gợi ý.
 * @param {number} time - Thời gian hiện tại.
 */
function animateHintIcon(time) {
  if (!hintIcon) return;

  if (!introStarted) {
    hintIcon.visible = true;

    // Hiệu ứng "nhấn" tới lui
    const tapFrequency = 2.5;
    const tapAmplitude = 1.5;
    const tapOffset = Math.sin(time * tapFrequency) * tapAmplitude;

    // Di chuyển icon tới lui theo hướng nó đang nhìn
    const direction = new THREE.Vector3();
    hintIcon.getWorldDirection(direction);
    hintIcon.position.copy(hintIcon.userData.initialPosition).addScaledVector(direction, -tapOffset);

    // Xử lý văn bản gợi ý (thêm hiệu ứng mới)
    if (hintText) {
      hintText.visible = true;
      hintText.material.opacity = 0.85 + Math.sin(time * 3) * 0.15;
      hintText.position.y = 15 + Math.sin(time * 2) * 0.5;
      hintText.lookAt(camera.position);
    }
  } else {
    // Ẩn icon đi khi intro đã bắt đầu
    if (hintIcon) hintIcon.visible = false;

    if (hintText) hintText.visible = false;
  }
}

// ---- CHỈNH SỬA VÒNG LẶP ANIMATE ----
// Bạn cần thay thế hàm animate() cũ bằng hàm đã được chỉnh sửa này.
function animate() {
  requestAnimationFrame(animate);
  const time = performance.now() * 0.001;

  // Cập nhật icon gợi ý
  animateHintIcon(time);

  controls.update();
  planet.material.uniforms.time.value = time * 0.5;

  // Logic fade-in sau khi bắt đầu
  if (fadeInProgress && fadeOpacity < 1) {
    fadeOpacity += 0.025;
    if (fadeOpacity > 1) fadeOpacity = 1;
  }

  if (!introStarted) {
    // Trạng thái trước khi intro bắt đầu
    fadeOpacity = 0.1;
    scene.traverse(obj => {
      if (obj.name === 'starfield') {
        if (obj.points && obj.material.opacity !== undefined) {
          obj.material.transparent = false;
          obj.material.opacity = 1;
        }
        return;
      }
      if (obj.userData.isTextRing || (obj.parent && obj.parent.userData && obj.parent.userData.isTextRing)) {
        if (obj.material && obj.material.opacity !== undefined) {
          obj.material.transparent = false;
          obj.material.opacity = 1;
        }
        if (obj.material && obj.material.color) {
          obj.material.color.set(0xffffff);
        }
      } else if (obj !== planet && obj !== centralGlow && obj !== hintIcon && obj.type !== 'Scene' && !obj.parent.isGroup) {
        if (obj.material && obj.material.opacity !== undefined) {
          obj.material.transparent = true;
          obj.material.opacity = 0.1;
        }
      }
    });
    planet.visible = true;
    centralGlow.visible = true;
  } else {
    // Trạng thái sau khi intro bắt đầu
    scene.traverse(obj => {
      if (!(obj.userData.isTextRing || (obj.parent && obj.parent.userData && obj.parent.userData.isTextRing) || obj === planet || obj === centralGlow || obj.type === 'Scene')) {
        if (obj.material && obj.material.opacity !== undefined) {
          obj.material.transparent = true;
          obj.material.opacity = fadeOpacity;
        }
      } else {
        if (obj.material && obj.material.opacity !== undefined) {
          obj.material.opacity = 1;
          obj.material.transparent = false;
        }
      }
      if (obj.material && obj.material.color) {
        obj.material.color.set(0xffffff);
      }
    });
  }

  // Dòng tiêu đề lớn: luôn hướng về camera, giữ độ sáng đầy đủ
  if (window.bigTitleMeshes) {
    window.bigTitleMeshes.forEach(function (m) {
      m.lookAt(camera.position);
      m.material.opacity = 1;
      m.material.transparent = true;
    });
  }

  // Cập nhật sao băng
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const star = shootingStars[i];
    star.userData.life++;

    let opacity = 1.0;
    if (star.userData.life < 30) {
      opacity = star.userData.life / 30;
    } else if (star.userData.life > star.userData.maxLife - 30) {
      opacity = (star.userData.maxLife - star.userData.life) / 30;
    }

    star.userData.progress += star.userData.speed;
    if (star.userData.progress > 1) {
      scene.remove(star);
      shootingStars.splice(i, 1);
      continue;
    }

    const currentPos = star.userData.curve.getPoint(star.userData.progress);
    star.position.copy(currentPos);
    star.userData.head.material.opacity = opacity;
    star.userData.head.children[0].material.uniforms.time.value = time;

    const trail = star.userData.trail;
    const trailPoints = star.userData.trailPoints;
    trailPoints[0].copy(currentPos);
    for (let j = 1; j < star.userData.trailLength; j++) {
      const trailProgress = Math.max(0, star.userData.progress - j * 0.01);
      trailPoints[j].copy(star.userData.curve.getPoint(trailProgress));
    }
    trail.geometry.setFromPoints(trailPoints);
    trail.material.opacity = opacity * 0.7;
  }

  if (shootingStars.length < 3 && Math.random() < 0.02) {
    createShootingStar();
  }

  // Logic chuyển đổi material cho các nhóm điểm trái tim
  scene.traverse(obj => {
    if (obj.isPoints && obj.userData.materialNear && obj.userData.materialFar) {
      const positionAttr = obj.geometry.getAttribute('position');
      let isClose = false;
      for (let i = 0; i < positionAttr.count; i++) {
        const worldX = positionAttr.getX(i) + obj.position.x;
        const worldY = positionAttr.getY(i) + obj.position.y;
        const worldZ = positionAttr.getZ(i) + obj.position.z;
        const distance = camera.position.distanceTo(new THREE.Vector3(worldX, worldY, worldZ));
        if (distance < 10) {
          isClose = true;
          break;
        }
      }
      if (isClose) {
        if (obj.material !== obj.userData.materialNear) {
          obj.material = obj.userData.materialNear;
          obj.geometry = obj.userData.geometryNear;
        }
      } else {
        if (obj.material !== obj.userData.materialFar) {
          obj.material = obj.userData.materialFar;
          obj.geometry = obj.userData.geometryFar;
        }
      }
    }
  });

  planet.lookAt(camera.position);
  animatePlanetSystem();

  if (starField && starField.material && starField.material.opacity !== undefined) {
    starField.material.opacity = 1.0;
    starField.material.transparent = false;
  }

  renderer.render(scene, camera);
}
function createHintText() {
  const canvasSize = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = canvasSize;
  const context = canvas.getContext('2d');
  // Tăng font size từ 50 → 75 để rõ hơn khi map vào plane 3D
  const fontSize = 75;
  const text = "Chạm Vào Tinh Cầu";
  context.font = `bold ${fontSize}px Arial, sans-serif`;
  context.textAlign = 'center';
  context.textBaseline = 'middle';

  // Nền mờ tối (pill) phía sau dòng chữ để tách khỏi hành tinh sáng phía sau
  const textWidth = context.measureText(text).width;
  const padX = 56;
  const padY = 36;
  const pillX = (canvasSize - textWidth) / 2 - padX;
  const pillY = (canvasSize - fontSize) / 2 - padY;
  const pillW = textWidth + padX * 2;
  const pillH = fontSize + padY * 2;
  const pillRadius = pillH / 2;
  context.save();
  context.shadowColor = 'rgba(0, 0, 0, 0.6)';
  context.shadowBlur = 20;
  context.fillStyle = 'rgba(0, 0, 0, 0.65)';
  context.beginPath();
  context.moveTo(pillX + pillRadius, pillY);
  context.arcTo(pillX + pillW, pillY, pillX + pillW, pillY + pillH, pillRadius);
  context.arcTo(pillX + pillW, pillY + pillH, pillX, pillY + pillH, pillRadius);
  context.arcTo(pillX, pillY + pillH, pillX, pillY, pillRadius);
  context.arcTo(pillX, pillY, pillX + pillW, pillY, pillRadius);
  context.closePath();
  context.fill();
  context.restore();

  // DOUBLE STROKE: viền TRẮNG dày ở ngoài cùng (tạo tách bạch hoàn toàn)
  context.lineJoin = 'round';
  context.lineWidth = 14;
  context.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  context.strokeText(text, canvasSize / 2, canvasSize / 2);

  // Viền ĐEN dày bên trong viền trắng (đã có, giữ lại)
  context.lineWidth = 9;
  context.strokeStyle = 'rgba(0, 0, 0, 0.9)';
  context.strokeText(text, canvasSize / 2, canvasSize / 2);

  // Glow hồng nhẹ
  context.shadowColor = '#e0b3ff';
  context.shadowBlur = 8;
  context.lineWidth = 2;
  context.strokeStyle = 'rgba(220, 180, 255, 0.5)';
  context.strokeText(text, canvasSize / 2, canvasSize / 2);
  context.shadowColor = 'transparent';
  context.shadowBlur = 0;
  context.fillStyle = 'white';
  context.fillText(text, canvasSize / 2, canvasSize / 2);
  const textTexture = new THREE.CanvasTexture(canvas);
  textTexture.needsUpdate = true;
  const textMaterial = new THREE.MeshBasicMaterial({
    map: textTexture,
    transparent: true,
    side: THREE.DoubleSide
  });
  const planeGeometry = new THREE.PlaneGeometry(16, 8);
  hintText = new THREE.Mesh(planeGeometry, textMaterial);
  // Dời y cao hơn hẳn: planet radius=10 + glow/bloom ~5 + khoảng cách an toàn ~15 = 30
  // Cũ: y=15 (trùng đỉnh hành tinh, bị glow che)
  hintText.position.set(0, 30, 0);
  scene.add(hintText);
}

// ---- TẠO 2 DÒNG TIÊU ĐỀ LỚN (nhập từ form) ----
function createBigTitleText() {
  const lines = [bigTitleTexts[0] || '', bigTitleTexts[1] || ''];
  if (!lines[0] && !lines[1]) return;

  const fontSize = 150;
  const padX = 130;
  const padY = 80;
  const lineGap = fontSize * 1.45;

  const measureCanvas = document.createElement('canvas');
  const measureCtx = measureCanvas.getContext('2d');
  measureCtx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
  const maxW = Math.max(
    measureCtx.measureText(lines[0]).width,
    measureCtx.measureText(lines[1]).width
  );

  const canvasW = Math.max(600, maxW + padX * 2);
  const canvasH = (lines.length > 1 ? lineGap + fontSize : fontSize) + padY * 2;

  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  const context = canvas.getContext('2d');
  context.font = 'bold ' + fontSize + 'px Arial, sans-serif';
  context.textAlign = 'center';
  context.textBaseline = 'middle';

  // Nền pill mờ tối phía sau khối chữ (tách khỏi thiên hà)
  const pillW = canvasW - 40;
  const pillH = canvasH - 40;
  const pillRadius = pillH / 2;
  context.save();
  context.shadowColor = 'rgba(0, 0, 0, 0.6)';
  context.shadowBlur = 30;
  context.fillStyle = 'rgba(0, 0, 0, 0.6)';
  context.beginPath();
  context.moveTo(20 + pillRadius, 20);
  context.arcTo(20 + pillW, 20, 20 + pillW, 20 + pillH, pillRadius);
  context.arcTo(20 + pillW, 20 + pillH, 20, 20 + pillH, pillRadius);
  context.arcTo(20, 20 + pillH, 20, 20, pillRadius);
  context.arcTo(20, 20, 20 + pillW, 20, pillRadius);
  context.closePath();
  context.fill();
  context.restore();

  // Vẽ 2 dòng: viền TRẮNG ngoài + viền ĐEN trong + fill trắng (đồng bộ hint text)
  const startY = canvasH / 2 - (lines.length - 1) * lineGap / 2;
  lines.forEach(function (line, i) {
    const y = startY + i * lineGap;
    context.lineJoin = 'round';
    context.lineWidth = 22;
    context.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    context.strokeText(line, canvasW / 2, y);
    context.lineWidth = 12;
    context.strokeStyle = 'rgba(0, 0, 0, 0.9)';
    context.strokeText(line, canvasW / 2, y);
    context.shadowColor = '#e0b3ff';
    context.shadowBlur = 10;
    context.lineWidth = 4;
    context.strokeStyle = 'rgba(220, 180, 255, 0.5)';
    context.strokeText(line, canvasW / 2, y);
    context.shadowColor = 'transparent';
    context.shadowBlur = 0;
    context.fillStyle = 'white';
    context.fillText(line, canvasW / 2, y);
  });

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  // Gắn tiêu đề VÀO CAMERA (camera-space billboard, HUD overlay) thay vì tọa độ
  // world cố định: tọa độ world (0, 42, 0) rơi RA NGOÀI frustum khi camera bay
  // (intro start (0,20,30) và điểm dừng cuối (0,30,50) đều nhìn thấp xuống gốc
  // tọa độ, khiến y=42 lệch hẳn lên trên mép khung hình). Là child của camera,
  // tiêu đề luôn nằm trong tầm nhìn ở MỌI mốc animation — trước, trong lúc bay,
  // và sau khi camera dừng. Vị trí local (0, 24, -60) = 60 đơn vị trước camera,
  // nhích lên trên (NDC y ~0.40–0.64) để luôn nằm phía trên hành tinh kể cả lúc
  // camera bay gần nhất (seg1), không che ảnh hay hint text.
  const worldH = 11;
  const worldW = worldH * canvasW / canvasH;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldH), material);
  mesh.position.set(0, 24, -60);
  camera.add(mesh);
  scene.add(camera);

  window.bigTitleMeshes = [mesh];
}

// ---- CÁC HÀM XỬ LÝ SỰ KIỆN VÀ KHỞI ĐỘNG ----

createShootingStar();
createHintIcon(); // Gọi hàm tạo icon
createHintText();
createBigTitleText();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  controls.target.set(0, 0, 0);
  controls.update();
});

function startCameraAnimation() {
  introAnimActive = true;
  const startPos = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
  const midPos1 = { x: startPos.x, y: 0, z: startPos.z };
  const midPos2 = { x: startPos.x, y: 0, z: 80 };
  const endPos = { x: 0, y: 30, z: 50 };

  const duration1 = 0.2;
  const duration2 = 0.55;
  const duration3 = 0.4;
  let progress = 0;

  function animatePath() {
    // progress += 0.001010;
    progress += 0.0025;
    let newPos;

    if (progress < duration1) {
      let t = progress / duration1;
      newPos = {
        x: startPos.x + (midPos1.x - startPos.x) * t,
        y: startPos.y + (midPos1.y - startPos.y) * t,
        z: startPos.z + (midPos1.z - startPos.z) * t,
      };
    } else if (progress < duration1 + duration2) {
      let t = (progress - duration1) / duration2;
      newPos = {
        x: midPos1.x + (midPos2.x - midPos1.x) * t,
        y: midPos1.y + (midPos2.y - midPos1.y) * t,
        z: midPos1.z + (midPos2.z - midPos1.z) * t,
      };
    } else if (progress < duration1 + duration2 + duration3) {
      let t = (progress - duration1 - duration2) / duration3;
      let easedT = 0.5 - 0.5 * Math.cos(Math.PI * t); // Ease-in-out
      newPos = {
        x: midPos2.x + (endPos.x - midPos2.x) * easedT,
        y: midPos2.y + (endPos.y - midPos2.y) * easedT,
        z: midPos2.z + (endPos.z - midPos2.z) * easedT,
      };
    } else {
      camera.position.set(endPos.x, endPos.y, endPos.z);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.update();
      controls.enabled = true;
      introAnimActive = false;
      beginAutoFocus();
      return;
    }

    camera.position.set(newPos.x, newPos.y, newPos.z);
    camera.lookAt(0, 0, 0);
    requestAnimationFrame(animatePath);
  }
  controls.enabled = false;
  animatePath();
}

/* =======================================================================
   TỰ ĐỘNG XOAY VÒNG FOCUS CÁC ẢNH ("Chạm Vào Tinh Cầu")
   - Sau khi hiệu ứng chạm tinh cầu kết thúc, camera tự động FOCUS (zoom
     gần, nhìn thẳng) vào 1 tấm ảnh cụ thể — áp dụng cho MỌI trường hợp có
     ảnh, kể cả khi chỉ upload đúng 1 ảnh.
   - Giữ ở mỗi ảnh vài giây rồi chuyển sang ảnh khác NGẪU NHIÊN; riêng
     trường hợp chỉ có 1 ảnh thì dừng lại ở ảnh đó, không đổi.
   - Dùng tween/lerp mượt, dọn dẹp timer cũ trước mỗi vòng để không rò rỉ.
======================================================================= */
let photoCycleTimer = null;
let photoFocusIdx = -1;
let currentTween = null;

function cancelCameraTween() {
  if (currentTween) {
    currentTween.cancelled = true;
    currentTween = null;
  }
}

function stopPhotoCycle() {
  if (photoCycleTimer) {
    clearTimeout(photoCycleTimer);
    photoCycleTimer = null;
  }
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function tweenCameraTo(camPos, target, durationSec, onComplete) {
  cancelCameraTween();
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const toPos = camPos.clone();
  const toTarget = target.clone();
  const tween = { cancelled: false };
  currentTween = tween;

  const prevAutoRotate = controls.autoRotate;
  controls.autoRotate = false;

  const startTime = performance.now();
  function step() {
    if (tween.cancelled) return;
    const elapsed = performance.now() - startTime;
    const t = Math.min(1, elapsed / (durationSec * 1000));
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      controls.autoRotate = prevAutoRotate;
      currentTween = null;
      if (onComplete) onComplete();
    }
  }
  step();
}

/* -----------------------------------------------------------------------
   CHỌN ĐIỂM ĐỂ FOCUS

   QUAN TRỌNG — đây chính là chỗ đã gây lỗi "camera không zoom vào ảnh nào":
   photoGroups[i] KHÔNG phải một cụm điểm gọn nằm ở một chỗ. Điểm của mỗi
   nhóm được rải đều trên cả 6 nhánh thiên hà (bán kính 30 → 100), nên TÂM
   của nhóm (group.position) luôn xấp xỉ gốc toạ độ (0,0,0). Code cũ lấy tâm
   nhóm làm mục tiêu focus → camera chỉ bay về giữa thiên hà, nhìn toàn cảnh,
   và mọi nhóm ảnh đều cho ra cùng một điểm đích nên "đổi ảnh" trông như
   không có gì xảy ra.

   Cách đúng: mỗi ĐIỂM trong nhóm là một sprite mang trọn tấm ảnh, nên phải
   chọn NGẪU NHIÊN MỘT ĐIỂM của nhóm và bay tới sát điểm đó.
----------------------------------------------------------------------- */
const FOCUS_CAM_DISTANCE = 4.2;   // khoảng cách camera ↔ tấm ảnh khi zoom gần
const FOCUS_TWEEN_SEC    = 2.4;   // thời gian bay mượt giữa 2 ảnh
const FOCUS_HOLD_MS      = 3500;  // giữ ở mỗi ảnh bao lâu trước khi đổi
const FOCUS_MIN_RADIUS   = 34;    // tránh điểm nằm sát hành tinh / vòng chữ
const FOCUS_MAX_RADIUS   = 85;    // tránh điểm ở rìa ngoài cùng thiên hà

function pickFocusPointWorld(group) {
  const posAttr = group.geometry.getAttribute('position');
  if (!posAttr || posAttr.count === 0) return null;

  const v = new THREE.Vector3();
  let fallback = null;
  // Bốc thử vài điểm ngẫu nhiên, ưu tiên điểm nằm trong vùng đẹp của đĩa
  for (let attempt = 0; attempt < 24; attempt++) {
    const i = Math.floor(Math.random() * posAttr.count);
    v.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i)).add(group.position);
    const r = v.length();
    if (!isFinite(r) || r < 1) continue;
    if (!fallback) fallback = v.clone();
    if (r >= FOCUS_MIN_RADIUS && r <= FOCUS_MAX_RADIUS) return v.clone();
  }
  return fallback;
}

function getFocusPosition(group) {
  const point = pickFocusPointWorld(group);
  if (!point) return null;

  // Đứng phía ngoài tấm ảnh (hướng từ tâm thiên hà ra) và chếch lên một chút
  // để nhìn thẳng vào ảnh, phía sau là thiên hà + hành tinh.
  const dir = point.clone().normalize();
  if (!isFinite(dir.x) || !isFinite(dir.y) || !isFinite(dir.z) || dir.lengthSq() < 0.01) {
    dir.set(0, 0, 1);
  }
  dir.y += 0.35;
  dir.normalize();

  const camPos = point.clone().addScaledVector(dir, FOCUS_CAM_DISTANCE);
  return { camPos: camPos, target: point };
}

function pickRandomPhoto(excludeIdx) {
  if (photoGroups.length === 0) return -1;
  if (photoGroups.length === 1) return 0;
  let idx;
  do {
    idx = Math.floor(Math.random() * photoGroups.length);
  } while (idx === excludeIdx);
  return idx;
}

function focusPhoto(idx, auto) {
  const group = photoGroups[idx];
  if (!group) return;
  const spot = getFocusPosition(group);
  if (!spot) return;
  photoFocusIdx = idx;
  tweenCameraTo(spot.camPos, spot.target, FOCUS_TWEEN_SEC, function () {
    if (auto) scheduleNextFocus();
  });
}

function scheduleNextFocus() {
  stopPhotoCycle();
  // Chỉ có 1 ảnh: đã zoom vào ảnh đó rồi, không cần đổi qua đổi lại.
  if (photoGroups.length <= 1) return;
  photoCycleTimer = setTimeout(function () {
    photoCycleTimer = null;
    focusPhoto(pickRandomPhoto(photoFocusIdx), true);
  }, FOCUS_HOLD_MS);
}

let autoFocusRetry = 0;

function beginAutoFocus() {
  cancelCameraTween();
  stopPhotoCycle();

  // Ảnh nạp bất đồng bộ (img.onload): nếu hiệu ứng intro chạy xong trước khi
  // nhóm điểm đầu tiên kịp tạo thì chờ rồi thử lại, thay vì bỏ luôn tính năng.
  if (photoGroups.length === 0) {
    if (autoFocusRetry++ < 20) {
      photoCycleTimer = setTimeout(beginAutoFocus, 500);
    }
    return;
  }

  autoFocusRetry = 0;
  // Áp dụng cho MỌI trường hợp có ảnh, kể cả đúng 1 ảnh.
  focusPhoto(pickRandomPhoto(-1), true);
}




const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let introStarted = false;
let introAnimActive = false;

// Giới hạn số lượng sao hiển thị ban đầu
const originalStarCount = starGeometry.getAttribute('position').count;
if (starField && starField.geometry) {
  starField.geometry.setDrawRange(0, Math.floor(originalStarCount * 0.1));
}

function requestFullScreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.mozRequestFullScreen) { // Firefox
    elem.mozRequestFullScreen();
  } else if (elem.webkitRequestFullscreen) { // Chrome, Safari, Opera
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) { // IE/Edge
    elem.msRequestFullscreen();
  }
}

function onCanvasClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObject(planet);
  if (intersects.length === 0) return;

  if (!introStarted) {
    requestFullScreen();
    introStarted = true;
    fadeInProgress = true;
    document.body.classList.add("intro-started");
    playGalaxyAudio(); // Khi script load, preload nhạc sẵn

    startCameraAnimation();

    if (starField && starField.geometry) {
      starField.geometry.setDrawRange(0, originalStarCount);
    }
    return;
  }

  // Click lại tinh cầu khi đã bắt đầu: nhảy ngay sang một tấm ảnh khác
  // (1 ảnh thì nhảy sang một điểm khác của chính ảnh đó) rồi chạy tiếp chu kỳ.
  if (!introAnimActive && photoGroups.length > 0) {
    cancelCameraTween();
    stopPhotoCycle();
    focusPhoto(pickRandomPhoto(photoFocusIdx), true);
  }
}

renderer.domElement.addEventListener("click", onCanvasClick);

animate();

planet.name = 'main-planet';
centralGlow.name = 'main-glow';

// ---- CÁC THIẾT LẬP CHO GIAO DIỆN VÀ MOBILE ----
function setFullScreen() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
  const container = document.getElementById('container');
  if (container) {
    container.style.height = `${window.innerHeight}px`;
  }
}

window.addEventListener('resize', setFullScreen);
window.addEventListener('orientationchange', () => {
  setTimeout(setFullScreen, 300);
});
setFullScreen();

const preventDefault = event => event.preventDefault();
document.addEventListener('touchmove', preventDefault, { passive: false });
document.addEventListener('gesturestart', preventDefault, { passive: false });

const container = document.getElementById('container');
if (container) {
  container.addEventListener('touchmove', preventDefault, { passive: false });
}

// ---- KIỂM TRA HƯỚNG MÀN HÌNH ĐỂ HIỂN THỊ CẢNH BÁO ----
// =======================================================================

function checkOrientation() {
  // Kiểm tra nếu chiều cao lớn hơn chiều rộng (màn hình dọc trên điện thoại)
  // Thêm một điều kiện nhỏ để không kích hoạt trên màn hình desktop hẹp.
  const isMobilePortrait = window.innerHeight > window.innerWidth && 'ontouchstart' in window;

  if (isMobilePortrait) {
    document.body.classList.add('portrait-mode');
  } else {
    document.body.classList.remove('portrait-mode');
  }
}

// Lắng nghe các sự kiện để kiểm tra lại hướng màn hình
window.addEventListener('DOMContentLoaded', checkOrientation);
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => {
  // Thêm độ trễ để trình duyệt cập nhật kích thước chính xác
  setTimeout(checkOrientation, 200);
});
